<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Console | Royals Marine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== Clean Monochrome Design System ===== */
    :root[data-theme="dark"] {
      --bg: #090a0f;
      --panel: #0d0f15;
      --card: #12141c;
      --surface: #161922;
      --hover: #1b1f2b;
      --active: #222736;
      --border: #1e222e;
      --border-subtle: #141720;
      --border-hover: #2e3446;
      --text: #ffffff;
      --text-sec: #94a3b8;
      --text-dim: #64748b;
      --text-ghost: #475569;
      --btn-bg: #141720;
      --btn-text: #ffffff;
      --btn-border: #222634;
      --btn-hover: #1c202c;
      --btn-pri-bg: #ffffff;
      --btn-pri-text: #090a0f;
      --btn-pri-hover: #e2e8f0;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --success: #22c55e;
      --modal-backdrop: rgba(0, 0, 0, 0.85);
      --scrollbar-thumb: #222634;
      --scrollbar-track: #090a0f;
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --panel: #ffffff;
      --card: #ffffff;
      --surface: #f1f5f9;
      --hover: #f1f5f9;
      --active: #e2e8f0;
      --border: #e2e8f0;
      --border-subtle: #edf2f7;
      --border-hover: #cbd5e1;
      --text: #0f172a;
      --text-sec: #475569;
      --text-dim: #64748b;
      --text-ghost: #94a3b8;
      --btn-bg: #ffffff;
      --btn-text: #0f172a;
      --btn-border: #cbd5e1;
      --btn-hover: #f1f5f9;
      --btn-pri-bg: #0f172a;
      --btn-pri-text: #ffffff;
      --btn-pri-hover: #1e293b;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --success: #16a34a;
      --modal-backdrop: rgba(15, 23, 42, 0.45);
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-track: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; line-height: 1.5;
      min-height: 100vh; display: flex; flex-direction: column;
      overflow: hidden; transition: background 0.15s, color 0.15s;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

    /* ===== Top Header ===== */
    header {
      height: 48px; padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); background: var(--panel);
      flex-shrink: 0; z-index: 50;
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 700; color: var(--text);
    }
    .brand-badge {
      font-size: 11px; font-weight: 500; color: var(--text-sec);
      background: var(--surface); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 5px; font-family: 'JetBrains Mono', monospace;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .status-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-sec); font-family: 'JetBrains Mono', monospace;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    .hdr-btn {
      background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text);
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.12s;
    }
    .hdr-btn:hover { background: var(--hover); border-color: var(--border-hover); }

    /* ===== App Layout ===== */
    .app-body { flex: 1; display: flex; height: calc(100vh - 48px); overflow: hidden; }

    /* ===== Left Sidebar: All DB Tables List ===== */
    .sidebar {
      width: 230px; border-right: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    .sidebar-search-box {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .table-filter-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; padding: 6px 10px; border-radius: 6px;
      font-family: inherit; outline: none; transition: border-color 0.12s;
    }
    .table-filter-input:focus { border-color: var(--text); }
    
    .sidebar-header {
      padding: 10px 14px 4px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
      display: flex; justify-content: space-between; align-items: center;
    }
    .table-list {
      flex: 1; overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px;
    }
    .table-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--text-sec); font-size: 12px; font-weight: 500;
      font-family: 'JetBrains Mono', monospace; cursor: pointer; text-align: left;
      transition: all 0.1s; width: 100%;
    }
    .table-item:hover { background: var(--hover); color: var(--text); }
    .table-item.active {
      background: var(--active); color: var(--text); font-weight: 600;
      border-color: var(--border);
    }
    .table-count-pill {
      font-size: 10px; color: var(--text-dim); background: var(--surface);
      padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-subtle);
    }

    .sidebar-footer {
      padding: 10px 12px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px; background: var(--panel);
    }

    /* ===== Main Content Area: Data Table Explorer ===== */
    .main-view { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); overflow: hidden; }

    /* Table Toolbar */
    .data-toolbar {
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--panel); flex-shrink: 0; flex-wrap: wrap;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .active-table-name {
      font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;
      color: var(--text); display: inline-flex; align-items: center; gap: 6px;
    }
    .active-table-total {
      font-size: 11px; color: var(--text-dim); background: var(--surface);
      padding: 2px 7px; border-radius: 5px; font-weight: 500; border: 1px solid var(--border);
    }
    
    .row-search-input {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 12px; padding: 5px 10px; border-radius: 6px; font-family: inherit;
      outline: none; width: 190px; transition: border-color 0.12s;
    }
    .row-search-input:focus { border-color: var(--text); }

    .btn {
      padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--btn-border); background: var(--btn-bg);
      color: var(--btn-text); font-family: inherit; display: inline-flex; align-items: center;
      gap: 5px; transition: all 0.1s;
    }
    .btn:hover { background: var(--btn-hover); color: var(--text); border-color: var(--border-hover); }
    .btn-primary { background: var(--btn-pri-bg); border-color: var(--btn-pri-bg); color: var(--btn-pri-text); font-weight: 600; }
    .btn-primary:hover { background: var(--btn-pri-hover); border-color: var(--btn-pri-hover); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger-bg); }

    /* Data Table */
    .table-container { flex: 1; overflow: auto; background: var(--bg); position: relative; }
    table.data-grid { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; font-size: 12px; }
    table.data-grid th {
      position: sticky; top: 0; background: var(--panel);
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; color: var(--text-sec);
      text-transform: uppercase; letter-spacing: 0.05em; z-index: 10;
      user-select: none;
    }
    table.data-grid td {
      padding: 7px 12px; border-bottom: 1px solid var(--border-subtle);
      color: var(--text); max-width: 320px; overflow: hidden; text-overflow: ellipsis;
    }
    table.data-grid tr:hover td { background: var(--hover); }
    .cell-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .cell-null { color: var(--text-ghost); font-style: italic; font-size: 11px; }

    /* Footer Pagination */
    .data-footer {
      height: 38px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border); background: var(--panel);
      font-size: 11px; color: var(--text-sec); flex-shrink: 0;
    }
    .pager-controls { display: flex; align-items: center; gap: 5px; }
    .pager-btn {
      padding: 3px 8px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    .pager-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* SQL Console Overlay */
    .sql-panel {
      display: none; flex-direction: column; flex: 1; overflow: hidden; background: var(--bg);
    }
    .sql-panel.show { display: flex; }
    .sql-editor-header {
      padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sql-editor-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .sql-textarea {
      width: 100%; min-height: 90px; max-height: 200px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 10px; outline: none; line-height: 1.6; resize: vertical;
    }
    .sql-textarea:focus { border-color: var(--text); }
    .sql-results-area { flex: 1; overflow: auto; background: var(--bg); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: var(--modal-backdrop);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .modal-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; line-height: 1; }
    .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 7px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--text-sec); font-family: 'JetBrains Mono', monospace; }
    .form-input {
      background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
      padding: 6px 9px; color: var(--text); font-size: 12px; font-family: inherit; outline: none;
    }
    .form-input:focus { border-color: var(--text); }

    /* Toast */
    .toast {
      position: fixed; bottom: 18px; right: 18px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 7px 16px; border-radius: 6px; font-size: 11px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4); display: none; z-index: 300;
    }
    .toast.show { display: block; animation: slideUp 0.15s ease; }
    @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-group">
      <span class="brand-title">Royals Marine</span>
      <span class="brand-badge">Database Tables & Data</span>
    </div>

    <div class="header-actions">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Aiven MySQL Online</span>
      </div>
      <button class="hdr-btn" id="themeBtn" onclick="toggleTheme()">☀ Light</button>
      <button class="hdr-btn" onclick="toggleSqlConsole()">>_ SQL Query</button>
    </div>
  </header>

  <!-- App Body -->
  <div class="app-body">
    <!-- Left Sidebar: All DB Tables List -->
    <aside class="sidebar">
      <div class="sidebar-search-box">
        <input type="text" id="tableFilterInput" class="table-filter-input" placeholder="Search tables..." oninput="filterTablesList(this.value)" />
      </div>
      <div class="sidebar-header">
        <span>Database Tables</span>
        <span id="tablesCountLabel" style="font-family:'JetBrains Mono',monospace;">—</span>
      </div>
      <div class="table-list" id="tablesList">
        <div style="padding:20px;text-align:center;color:var(--text-dim);">Loading tables...</div>
      </div>
      <div class="sidebar-footer">
        <button class="btn" onclick="loadTablesList()" style="width:100%;justify-content:center;">⟳ Refresh Tables</button>
      </div>
    </aside>

    <!-- Main View: Table Data Explorer -->
    <main class="main-view" id="mainView">
      <!-- Toolbar -->
      <div class="data-toolbar">
        <div class="toolbar-left">
          <span class="active-table-name" id="activeTableName">users</span>
          <span class="active-table-total" id="activeTableCount">0 rows</span>
          <input type="text" id="rowSearchInput" class="row-search-input" placeholder="Search rows..." oninput="filterRows(this.value)" />
        </div>
        <div class="toolbar-right">
          <button class="btn" onclick="openSchemaModal()">⎔ Schema</button>
          <button class="btn" onclick="exportData('csv')">↓ CSV</button>
          <button class="btn" onclick="exportData('json')">↓ JSON</button>
          <button class="btn" onclick="loadTableData()">⟳ Reload</button>
          <button class="btn btn-primary" onclick="openNewRowModal()">+ New Row</button>
        </div>
      </div>

      <!-- Table Container -->
      <div class="table-container" id="tableContainer">
        <div style="padding:60px 20px;text-align:center;color:var(--text-dim);">Select a table to inspect data</div>
      </div>

      <!-- Footer Pagination -->
      <div class="data-footer">
        <div id="footerInfo">0 rows</div>
        <div class="pager-controls">
          <button class="pager-btn" id="prevBtn" onclick="changePage(-1)">‹ Prev</button>
          <span id="pageText" style="font-family:'JetBrains Mono',monospace;">1 / 1</span>
          <button class="pager-btn" id="nextBtn" onclick="changePage(1)">Next ›</button>
        </div>
      </div>
    </main>

    <!-- SQL Console View -->
    <div class="sql-panel" id="sqlPanel">
      <div class="sql-editor-header">
        <span style="font-weight:700;font-size:12px;font-family:'JetBrains Mono',monospace;">SQL Query Console</span>
        <button class="btn" onclick="toggleSqlConsole()">← Back to Tables</button>
      </div>
      <div class="sql-editor-body">
        <textarea id="sqlInput" class="sql-textarea" placeholder="SELECT * FROM users LIMIT 25;" spellcheck="false"></textarea>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="runSqlQuery()">▶ Execute</button>
          <button class="btn" onclick="document.getElementById('sqlInput').value=''">Clear</button>
        </div>
      </div>
      <div class="sql-results-area" id="sqlResultsArea">
        <div style="padding:40px;text-align:center;color:var(--text-dim);">Run a query to inspect records</div>
      </div>
    </div>
  </div>

  <!-- Row Edit / Insert Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Insert Row</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="btnModalSave" onclick="saveRowRecord()">Save</button>
      </div>
    </div>
  </div>

  <!-- Schema Modal -->
  <div class="modal-backdrop" id="schemaModalBackdrop">
    <div class="modal" style="max-width:620px;">
      <div class="modal-header">
        <div class="modal-title" id="schemaModalTitle">Table Schema</div>
        <button class="modal-close" onclick="closeSchemaModal()">&times;</button>
      </div>
      <div class="modal-body" id="schemaModalBody"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeSchemaModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Notification</div>

  <script>
    // State Store
    const S = {
      tables: [],
      currentTable: 'users',
      tableRows: [],
      tableCols: [],
      primaryKey: 'id',
      page: 1,
      limit: 25,
      totalRows: 0,
      totalPages: 1,
      search: '',
      modalMode: 'insert',
      editingRow: null,
    };

    const $ = id => document.getElementById(id);

    // Theme Toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('rm_console_theme', next);
      $('themeBtn').textContent = next === 'dark' ? '☀ Light' : '☾ Dark';
    }
    const savedTheme = localStorage.getItem('rm_console_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if ($('themeBtn')) $('themeBtn').textContent = savedTheme === 'dark' ? '☀ Light' : '☾ Dark';

    let toastTimeout;
    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
    }

    function esc(s) {
      if (s === null || s === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function toggleSqlConsole() {
      const sqlP = $('sqlPanel');
      const isShowing = sqlP.classList.contains('show');
      sqlP.classList.toggle('show', !isShowing);
      $('mainView').style.display = isShowing ? 'flex' : 'none';
      if (!isShowing) $('sqlInput').focus();
    }

    // ===== 1. Load All Database Tables =====
    async function loadTablesList() {
      const listEl = $('tablesList');
      try {
        const res = await (await fetch('/api/console/tables')).json();
        if (res.success && res.data?.tables) {
          S.tables = res.data.tables;
          $('tablesCountLabel').textContent = `${S.tables.length} tables`;
          renderTablesList(S.tables);

          // Select first table if current is not in list
          if (!S.tables.find(t => t.name === S.currentTable)) {
            S.currentTable = S.tables[0]?.name || 'users';
          }
          selectTable(S.currentTable);
        } else {
          listEl.innerHTML = '<div style="padding:16px;color:var(--danger);">Error loading tables</div>';
        }
      } catch (e) {
        listEl.innerHTML = '<div style="padding:16px;color:var(--danger);">Failed to connect to database</div>';
      }
    }

    function renderTablesList(tables) {
      const listEl = $('tablesList');
      if (!tables || tables.length === 0) {
        listEl.innerHTML = '<div style="padding:16px;color:var(--text-dim);">No matching tables</div>';
        return;
      }
      listEl.innerHTML = tables.map(t => `
        <button class="table-item ${t.name === S.currentTable ? 'active' : ''}" onclick="selectTable('${esc(t.name)}')">
          <span>${esc(t.name)}</span>
          <span class="table-count-pill">${t.count}</span>
        </button>
      `).join('');
    }

    function filterTablesList(query) {
      const q = (query || '').toLowerCase().trim();
      const filtered = S.tables.filter(t => t.name.toLowerCase().includes(q));
      renderTablesList(filtered);
    }

    function selectTable(tableName) {
      S.currentTable = tableName;
      S.page = 1;
      S.search = '';
      if ($('rowSearchInput')) $('rowSearchInput').value = '';

      // Highlight in sidebar
      document.querySelectorAll('.table-item').forEach(el => {
        const nameSpan = el.querySelector('span');
        if (nameSpan && nameSpan.textContent === tableName) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      // Switch to main view if in SQL mode
      $('sqlPanel').classList.remove('show');
      $('mainView').style.display = 'flex';

      $('activeTableName').textContent = tableName;
      loadTableData();
    }

    // ===== 2. Load Table Records =====
    async function loadTableData() {
      const container = $('tableContainer');
      container.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-dim);">Fetching records…</div>';

      try {
        const url = `/api/console/tables/${S.currentTable}?page=${S.page}&limit=${S.limit}&search=${encodeURIComponent(S.search)}`;
        const res = await (await fetch(url)).json();

        if (!res.success || !res.data) {
          container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--danger);">${esc(res.message || 'Error loading records')}</div>`;
          return;
        }

        const d = res.data;
        S.tableRows = d.rows || [];
        S.tableCols = d.columns || [];
        S.primaryKey = d.primaryKey || 'id';
        S.totalRows = d.total || 0;
        S.totalPages = Math.max(1, Math.ceil(S.totalRows / S.limit));

        $('activeTableCount').textContent = `${S.totalRows.toLocaleString()} rows`;
        $('footerInfo').textContent = `Showing ${S.tableRows.length} of ${S.totalRows.toLocaleString()} rows in \`${S.currentTable}\``;
        $('pageText').textContent = `${S.page} / ${S.totalPages}`;
        $('prevBtn').disabled = S.page <= 1;
        $('nextBtn').disabled = S.page >= S.totalPages;

        if (S.tableRows.length === 0) {
          container.innerHTML = `
            <div style="padding:60px 20px;text-align:center;color:var(--text-dim);">
              <div style="margin-bottom:10px;">No rows found in \`${esc(S.currentTable)}\`</div>
              <button class="btn btn-primary" onclick="openNewRowModal()">+ Insert First Row</button>
            </div>
          `;
          return;
        }

        // Render Data Table Grid
        let html = '<table class="data-grid"><thead><tr>';
        html += '<th style="width:36px;">#</th>';
        S.tableCols.forEach(col => {
          const colName = typeof col === 'object' ? col.field : col;
          const isPk = colName === S.primaryKey;
          html += `<th>${esc(colName)}${isPk ? ' 🔑' : ''}</th>`;
        });
        html += '<th style="text-align:right;width:100px;">Actions</th></tr></thead><tbody>';

        S.tableRows.forEach((row, i) => {
          const pkVal = row[S.primaryKey];
          html += '<tr>';
          html += `<td style="color:var(--text-dim);">${(S.page - 1) * S.limit + i + 1}</td>`;
          S.tableCols.forEach(col => {
            const colName = typeof col === 'object' ? col.field : col;
            const val = row[colName];
            if (val === null || val === undefined) {
              html += '<td class="cell-null">NULL</td>';
            } else if (typeof val === 'object') {
              html += `<td class="cell-mono" title="${esc(JSON.stringify(val))}">${esc(JSON.stringify(val))}</td>`;
            } else {
              html += `<td class="cell-mono" title="${esc(val)}">${esc(val)}</td>`;
            }
          });
          html += `
            <td style="text-align:right;">
              <button class="btn" style="padding:2px 6px;font-size:10px;" onclick="openEditRowModal(${i})">Edit</button>
              <button class="btn btn-danger" style="padding:2px 6px;font-size:10px;" onclick="deleteRow('${esc(pkVal)}')">Del</button>
            </td>
          `;
          html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--danger);">${esc(err.message)}</div>`;
      }
    }

    function changePage(delta) {
      const next = S.page + delta;
      if (next >= 1 && next <= S.totalPages) {
        S.page = next;
        loadTableData();
      }
    }

    function filterRows(val) {
      S.search = val.trim();
      S.page = 1;
      loadTableData();
    }

    // ===== 3. Insert / Edit Row Modals =====
    function openNewRowModal() {
      S.modalMode = 'insert';
      $('modalTitle').textContent = `Insert Into \`${S.currentTable}\``;
      $('btnModalSave').textContent = 'Insert Record';

      const body = $('modalBody');
      body.innerHTML = S.tableCols.map(col => {
        const name = typeof col === 'object' ? col.field : col;
        const isPk = name === S.primaryKey;
        return `
          <div class="form-group">
            <label class="form-label">${esc(name)} ${isPk ? '(Primary Key)' : ''}</label>
            <input type="text" class="form-input" id="field_${name}" placeholder="${isPk ? 'e.g. ID001' : ''}" />
          </div>
        `;
      }).join('');

      $('modalBackdrop').classList.add('open');
    }

    function openEditRowModal(idx) {
      S.modalMode = 'edit';
      const row = S.tableRows[idx];
      S.editingRow = row;
      $('modalTitle').textContent = `Edit \`${S.currentTable}\` Record (${row[S.primaryKey]})`;
      $('btnModalSave').textContent = 'Save Changes';

      const body = $('modalBody');
      body.innerHTML = S.tableCols.map(col => {
        const name = typeof col === 'object' ? col.field : col;
        const isPk = name === S.primaryKey;
        return `
          <div class="form-group">
            <label class="form-label">${esc(name)} ${isPk ? '(Primary Key - Read Only)' : ''}</label>
            <input type="text" class="form-input" id="field_${name}" value="${esc(row[name] ?? '')}" ${isPk ? 'disabled' : ''} />
          </div>
        `;
      }).join('');

      $('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      $('modalBackdrop').classList.remove('open');
    }

    async function saveRowRecord() {
      const data = {};
      S.tableCols.forEach(col => {
        const name = typeof col === 'object' ? col.field : col;
        const inp = $(`field_${name}`);
        if (inp) data[name] = inp.value;
      });

      try {
        if (S.modalMode === 'insert') {
          const res = await (await fetch(`/api/console/tables/${S.currentTable}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          })).json();

          if (res.success) {
            showToast('Row inserted successfully');
            closeModal();
            loadTableData();
            loadTablesList();
          } else {
            alert(res.message || 'Error inserting row');
          }
        } else {
          const pkVal = S.editingRow[S.primaryKey];
          const res = await (await fetch(`/api/console/tables/${S.currentTable}/${encodeURIComponent(pkVal)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          })).json();

          if (res.success) {
            showToast('Row updated successfully');
            closeModal();
            loadTableData();
          } else {
            alert(res.message || 'Error updating row');
          }
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteRow(idVal) {
      if (!confirm(`Delete row "${idVal}" from "${S.currentTable}"?`)) return;
      try {
        const res = await (await fetch(`/api/console/tables/${S.currentTable}/${encodeURIComponent(idVal)}`, {
          method: 'DELETE',
        })).json();
        if (res.success) {
          showToast('Record deleted');
          loadTableData();
          loadTablesList();
        } else {
          alert(res.message || 'Error deleting row');
        }
      } catch (err) {
        alert(err.message);
      }
    }

    // ===== 4. Schema Viewer =====
    async function openSchemaModal() {
      $('schemaModalTitle').textContent = `Schema: \`${S.currentTable}\``;
      const body = $('schemaModalBody');
      body.innerHTML = '<div style="color:var(--text-dim);padding:20px;text-align:center;">Loading schema…</div>';
      $('schemaModalBackdrop').classList.add('open');

      try {
        const res = await (await fetch(`/api/console/tables/${S.currentTable}/schema`)).json();
        if (res.success && res.data) {
          const d = res.data;
          body.innerHTML = `
            <table class="data-grid" style="margin-bottom:14px;">
              <thead>
                <tr><th>COLUMN</th><th>TYPE</th><th>NULLABLE</th><th>KEY</th><th>DEFAULT</th></tr>
              </thead>
              <tbody>
                ${(d.columns || []).map(c => `
                  <tr>
                    <td class="cell-mono" style="font-weight:600;">${esc(c.field)}</td>
                    <td class="cell-mono">${esc(c.type)}</td>
                    <td>${c.nullable ? 'YES' : 'NO'}</td>
                    <td>${c.isPrimary ? 'PRI 🔑' : (c.extra || '—')}</td>
                    <td class="cell-mono">${esc(c.defaultValue ?? '—')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            ${d.createTableSql ? `
              <div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--text-sec);">CREATE TABLE DDL:</div>
              <pre style="background:var(--surface);padding:10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);overflow:auto;max-height:160px;">${esc(d.createTableSql)}</pre>
            ` : ''}
          `;
        }
      } catch (err) {
        body.innerHTML = `<div style="color:var(--danger);">${esc(err.message)}</div>`;
      }
    }
    function closeSchemaModal() { $('schemaModalBackdrop').classList.remove('open'); }

    // ===== 5. Export CSV / JSON =====
    function exportData(format) {
      if (!S.tableRows || S.tableRows.length === 0) return alert('No rows to export');
      const cols = S.tableCols.map(c => typeof c === 'object' ? c.field : c);
      if (format === 'json') {
        const str = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(S.tableRows, null, 2));
        const a = document.createElement('a'); a.href = str; a.download = `${S.currentTable}.json`; a.click();
      } else {
        const lines = [cols.join(',')];
        S.tableRows.forEach(r => {
          const vals = cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`);
          lines.push(vals.join(','));
        });
        const a = document.createElement('a');
        a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(lines.join('\n'));
        a.download = `${S.currentTable}.csv`;
        a.click();
      }
    }

    // ===== 6. SQL Query Console =====
    async function runSqlQuery() {
      const q = $('sqlInput').value.trim();
      if (!q) return;
      const resArea = $('sqlResultsArea');
      resArea.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim);">Executing query…</div>';

      try {
        const res = await (await fetch('/api/console/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q }),
        })).json();

        if (!res.success) {
          resArea.innerHTML = `<div style="padding:20px;color:var(--danger);font-family:'JetBrains Mono',monospace;">Error: ${esc(res.message)}</div>`;
          return;
        }

        const data = res.data;
        if (Array.isArray(data) && data.length > 0) {
          const cols = Object.keys(data[0]);
          let h = '<table class="data-grid"><thead><tr>';
          cols.forEach(c => h += `<th>${esc(c)}</th>`);
          h += '</tr></thead><tbody>';
          data.forEach(row => {
            h += '<tr>';
            cols.forEach(c => h += `<td class="cell-mono">${esc(row[c])}</td>`);
            h += '</tr>';
          });
          h += '</tbody></table>';
          resArea.innerHTML = h;
        } else {
          resArea.innerHTML = `<div style="padding:20px;color:var(--success);font-family:'JetBrains Mono',monospace;">Query executed successfully. Result: ${esc(JSON.stringify(data))}</div>`;
        }
      } catch (err) {
        resArea.innerHTML = `<div style="padding:20px;color:var(--danger);">Error: ${esc(err.message)}</div>`;
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeSchemaModal(); }
    });

    // Initial Load
    loadTablesList();
  </script>
</body>
</html>
